[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcluster-mcp-server"
version = "1.0.0"
description = "MCP server for managing vcluster virtual Kubernetes clusters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kubernetes>=35.0.0",
    "mcp[cli]>=2.0.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
vcluster-mcp-server = "server:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
exclude = ["src/tests"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/tools", "src/utils", "src/prompt", "src/resources"]
sources = {"src" = ""}

[tool.hatch.build.targets.wheel.force-include]
"src/server.py" = "server.py"